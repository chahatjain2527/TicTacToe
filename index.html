<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link id="light-them" rel="stylesheet" href="lightThemStyle.css">    
    <script src="script.js" defer></script>
    <title>Tic-Tac-Toe</title>
</head>
<body>

    <div class="wrapper">

        <div class="theme-toggle">
            <span class="toggle-label">☀</span>
            <label class="switch">
                <input type="checkbox" id="themeToggle">
                <span class="slider"></span>
            </label>
            <span class="toggle-label toggle-text">☾</span>
        </div>

        <div class="theme-toggle ai">
            <span class="toggle-label">Friend</span>
            <label class="switch">
                <input type="checkbox" id="aiToggle">
                <span class="slider"></span>
            </label>
            <span class="toggle-label toggle-text">AI</span>
        </div>

        <div id="difficultySelector" style="display:none;">
            <label>
                <input type="radio" name="difficulty" value="easy">
                Easy
            </label>
            <label>
                <input type="radio" name="difficulty" value="medium" checked>
                Medium
            </label>
            <label>
                <input type="radio" name="difficulty" value="hard">
                Hard
            </label>
        </div>

        <header class="site-header">
            <h1 class="game-title">TIC<span class="accent">·</span>TAC<span class="accent">·</span>TOE</h1>
        </header>

        <div class="top-bar">
            <span class="turn-label">TURN</span>
            <p class="instructions"></p>
            <button id="btn1" class="btn">↺ New Game</button>
        </div>

        <div class="gameBox">
            <div class="box box1"></div>
            <div class="box box2"></div>
            <div class="box box3"></div>
            <div class="box box4"></div>
            <div class="box box5"></div>
            <div class="box box6"></div>
            <div class="box box7"></div>
            <div class="box box8"></div>
            <div class="box box9"></div>
        </div>

    </div>

</body>
</html>
